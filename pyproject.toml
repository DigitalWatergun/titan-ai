[project]
name = "titan-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "httpx>=0.28.1",
    "langchain>=1.2.14",
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.0.1",
    "langgraph>=1.1.4",
    "rich>=14.3.3",
    "typer>=0.24.1",
]

[project.scripts]
  titan = "titan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]
