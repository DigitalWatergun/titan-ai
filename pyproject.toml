[project]
name = "titan-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "einops>=0.8.2",
    "httpx>=0.28.1",
    "rich>=14.3.3",
    "sentence-transformers>=5.4.0",
    "python-dotenv>=1.0.0",
    "typer>=0.24.1",
    "textual>=8.2.8,<8.3",
    "trafilatura>=2.1.0",
]

[project.scripts]
  titan = "titan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan"]

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
